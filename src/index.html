<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#557253"><meta name="description" content="Build My Home — lập phương án xây nhà, tài chính, mặt bằng, vật liệu, dự toán và hồ sơ."><title>Build My Home</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><div id="app"><div class="boot-shell" style="min-height:100vh;display:grid;place-items:center;background:#f7f9f6;color:#44554a;font-family:Arial,sans-serif"><div style="text-align:center"><div style="font-size:42px">⌂</div><b>Build My Home</b><div style="font-size:12px;margin-top:8px;color:#708078">Đang khởi động ứng dụng…</div></div></div></div><div id="toast" role="status" aria-live="polite"></div><input hidden id="uploadScan" type="file" accept="image/*,video/mp4,video/quicktime,video/webm,video/mpeg,application/pdf,.mp4,.mov,.webm,.mpeg,.mpg,.pdf"><input hidden id="uploadPhoto" type="file" accept="image/*" capture="environment"><input hidden id="uploadPlan" type="file" accept=".pdf,image/*,application/pdf"><input hidden id="priceQuoteUpload" type="file" accept=".json,.csv,application/json,text/csv"><script>
window.__BMH_BOOT_OK=false;window.__BMH_BOOT_FAILED=false;window.__BMH_BOOT_ERRORS=[];
(function(){
  const record=(kind,value)=>{try{window.__BMH_BOOT_ERRORS.push({kind,message:String(value?.message||value||'Unknown error')});}catch(_){}};
  window.addEventListener('error',e=>record('error',e.error||e.message));
  window.addEventListener('unhandledrejection',e=>record('promise',e.reason));
  try{if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}}catch(_){}
  try{if('caches'in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>String(k).startsWith('bmh-')).map(k=>caches.delete(k)))).catch(()=>{});}}catch(_){}
  setTimeout(function(){
    if(window.__BMH_BOOT_OK||window.__BMH_BOOT_FAILED)return;
    var a=document.getElementById('app');if(!a)return;
    var errs=(window.__BMH_BOOT_ERRORS||[]).slice(-3).map(x=>x.message).filter(Boolean);
    a.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#f7f9f6;font-family:Arial,sans-serif;color:#5b4037"><div style="max-width:640px;padding:28px;text-align:center"><h2>Build My Home chưa khởi động được</h2><p>Runtime V5.0.2 Gemini AI-Native đã được nạp trực tiếp trong trang. Hãy nhấn Ctrl+F5 một lần. Nếu vẫn lỗi, gửi ảnh thông báo bên dưới.</p>'+(errs.length?'<pre style="white-space:pre-wrap;text-align:left;background:#fff7f3;border:1px solid #efd4c6;border-radius:12px;padding:12px;font-size:12px">'+errs.join('\n')+'</pre>':'')+'</div></div>';
  },6500);
})();
</script><!-- BMH_APP_INLINE --></body></html>

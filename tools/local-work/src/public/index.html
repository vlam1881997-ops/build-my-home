<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Work</title><style>body{font-family:system-ui;background:#0b1020;color:#e8ecf5;margin:0}.w{max-width:1050px;margin:auto;padding:28px}.c{background:#141b2d;border:1px solid #293552;border-radius:16px;padding:18px;margin:16px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,textarea,button{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;background:#0e1526;color:#fff;border:1px solid #3a4666}textarea{min-height:130px}button{margin-top:12px;background:#eef2ff;color:#111;font-weight:700}.pill{display:inline-block;background:#202a43;padding:5px 8px;border-radius:999px;margin:3px}.run{border-top:1px solid #303b59;padding:10px 0}.muted{color:#9ca9c4}pre{white-space:pre-wrap;max-height:300px;overflow:auto}@media(max-width:700px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>Local Work</h1><p class="muted">Nhiều AI · nhiều model · một dự án GitHub · worktree riêng · review trước push.</p><div class="c"><div class="g"><div>Dự án<select id="project"></select></div><div>Planner<select id="planner"></select></div><div>Worker<select id="worker"></select></div><div>Reviewer<select id="reviewer"></select></div></div><p>Nhiệm vụ</p><textarea id="goal" placeholder="Mô tả việc cần làm..."></textarea><button id="run">Giao việc</button><p id="status" class="muted"></p></div><div class="c"><h2>Agents</h2><div id="agents"></div></div><div class="c"><h2>Lịch sử</h2><div id="runs"></div></div></div><script src="/app.js"></script></body></html>

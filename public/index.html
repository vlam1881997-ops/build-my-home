  return Array.from({length:12},(_,i)=>{const m=i+1;return {month:m,status:risk.has(m)?'risk':watch.has(m)?'watch':best.has(m)?'good':'neutral'};});
};
BMH.siteAdaptation = (site=BMH.state?.project?.site||{}) => {
  const p=BMH.regionProfile(site), roadPct=site.road<3 ? .12 : site.road<5 ? .05 : .02;
  const flood=BMH.riskValue(p.flood),storm=BMH.riskValue(p.storm),corrosion=BMH.riskValue(p.corrosion),heat=BMH.riskValue(p.heat);
  const climatePct=BMH.clamp((Math.max(0,flood-1)*.012)+(Math.max(0,storm-1)*.008)+(Math.max(0,corrosion-1)*.004)+(Math.max(0,heat-1)*.003),0,.07);

BMH.haversineKm = (a,b) => {const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng),la1=toRad(a.lat),la2=toRad(b.lat);const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
BMH.nearestRegionPoint = (lat,lng) => {
  let best=null;
  for(const [province,r] of Object.entries(BMH.REGIONS))for(const d of (r.districts||[])){const km=BMH.haversineKm({lat,lng},{lat:d[1],lng:d[2]});if(!best||km<best.km)best={province,district:d[0],lat,lng,km};}
  return best;
};

BMH.localMeters = (point,origin) => {
  const lat0=Number(origin?.lat)||0, lng0=Number(origin?.lng)||0, lat=Number(point?.lat)||0, lng=Number(point?.lng)||0;
  return {x:(lng-lng0)*111320*Math.max(.2,Math.cos(lat0*Math.PI/180)),y:(lat-lat0)*111320};
};
BMH.polygonAreaMeters = points => {
  if(!Array.isArray(points)||points.length<3)return 0;
  const origin=points.reduce((a,p)=>({lat:a.lat+Number(p.lat)/points.length,lng:a.lng+Number(p.lng)/points.length}),{lat:0,lng:0});
  const xy=points.map(p=>BMH.localMeters(p,origin)); let sum=0;
  for(let i=0;i<xy.length;i++){const a=xy[i],b=xy[(i+1)%xy.length];sum+=a.x*b.y-b.x*a.y;}
  return Math.abs(sum)/2;
};
BMH.polygonPerimeterMeters = points => {
  if(!Array.isArray(points)||points.length<2)return 0; let total=0;
  for(let i=0;i<points.length;i++)total+=BMH.haversineKm(points[i],points[(i+1)%points.length])*1000;
  return total;
};
BMH.siteParcelStats = (site=BMH.state?.project?.site||{}) => {
  const custom=site.lotMode==='custom'&&Array.isArray(site.lotPoints)&&site.lotPoints.length>=3;
  const points=custom?site.lotPoints:[];
  const area=custom?BMH.polygonAreaMeters(points):Math.max(0,(Number(site.width)||0)*(Number(site.depth)||0));
  const perimeter=custom?BMH.polygonPerimeterMeters(points):Math.max(0,2*((Number(site.width)||0)+(Number(site.depth)||0)));
  const frontage=custom&&points.length>=2?BMH.haversineKm(points[0],points[1])*1000:(Number(site.width)||0);
  const approxDepth=frontage>0?area/frontage:(Number(site.depth)||0);
  return {mode:custom?'custom':'rect',points,area,perimeter,frontage,approxDepth};

BMH.buildableEnvelope = (site=BMH.state?.project?.site||{}) => {
  const width=Math.max(.1,Number(site.width)||5),depth=Math.max(.1,Number(site.depth)||20),plot=BMH.siteParcelStats(site);
  const front=BMH.clamp(Number(site.setbackFront)||0,0,depth*.45),rear=BMH.clamp(Number(site.setbackRear)||0,0,depth*.35),side=BMH.clamp(Number(site.setbackSide)||0,0,width*.25);
  const buildWidth=Math.max(.1,width-side*2),buildDepth=Math.max(.1,depth-front-rear),envelopeArea=buildWidth*buildDepth,coverage=BMH.clamp(Number(site.targetCoverage)||.68,.45,.90);
  const targetPlate=Math.min(envelopeArea,Math.max(0,plot.area)*coverage),floors=Math.max(1,Number(site.floors)||1),gfa=targetPlate*floors;
  return {plotArea:plot.area,width,depth,front,rear,side,buildWidth,buildDepth,envelopeArea,coverage,targetPlate,gfa,openArea:Math.max(0,plot.area-targetPlate)};
};
BMH.siteFeasibility = (site=BMH.state?.project?.site||{}) => {
  const env=BMH.buildableEnvelope(site),h=BMH.state?.project?.household||{},children=Array.isArray(h.children)?h.children.length:0,relatives=Array.isArray(h.relatives)?h.relatives.length:0,people=2+children+relatives;
  const separate=(h.children||[]).filter(c=>c.room!=='Ngủ chung').length,bedrooms=1+separate+((children-separate)>0?1:0)+(relatives?1:0),bathrooms=Math.max(1,Math.ceil(people/4));
  const required=BMH.clamp(54+bedrooms*14+bathrooms*5+people*3,70,260),capacity=required>0?env.gfa/required:1;
  const p=BMH.regionProfile(site),risk=BMH.riskValue(p.flood)+BMH.riskValue(p.storm)+BMH.riskValue(p.heat)+BMH.riskValue(p.corrosion),road=Number(site.road)||0;

  return {score,people,bedrooms,bathrooms,requiredGFA:required,capacity,env,notes};

BMH.climatePackageMultiplier = level => ({basic:.72,recommended:1,robust:1.38}[level]||1);
BMH.resiliencePlan = (site=BMH.state?.project?.site||{}) => {

BMH.angleDiff = (a,b) => {let d=Math.abs((a-b)%360);return d>180?360-d:d;};
BMH.windDirectionAngles = profile => {
  const t=String(profile?.wind||'').toLowerCase(), out=[];
  const add=(needle,ang)=>{if(t.includes(needle)&&!out.includes(ang))out.push(ang)};
  add('đông bắc',45); add('đông nam',135); add('tây nam',225); add('tây bắc',315); add('gió biển',90);
  return out.length?out:[135,225];
};
BMH.orientationAnalysis = (site=BMH.state?.project?.site||{}) => {
  const p=BMH.regionProfile(site), front=site.frontDirection||'Nam', ang=BMH.directionAngle(front), heat=BMH.riskValue(p.heat), storm=BMH.riskValue(p.storm);
  const westPenalty=Math.max(0,1-BMH.angleDiff(ang,270)/90), eastPenalty=Math.max(0,1-BMH.angleDiff(ang,90)/110);
  const sunPenalty=(westPenalty*18+eastPenalty*5)*Math.max(1,heat)/3;
  const winds=BMH.windDirectionAngles(p), windBest=Math.min(...winds.map(w=>BMH.angleDiff(ang,w))), windScore=BMH.clamp(Math.round(96-windBest*.32),48,96);
  const rainPenalty=storm>=3&&['Đông','Đông Bắc','Đông Nam'].includes(front)?8:0;
  const score=BMH.clamp(Math.round(92-sunPenalty-rainPenalty+Math.max(0,windScore-70)*.18),45,97);
  const heatLevel=sunPenalty>=14?'Cao':sunPenalty>=7?'Trung bình':'Thấp';
  const notes=[];
  if(westPenalty>.55&&heat>=2)notes.push('Mặt tiền có xu hướng nhận nắng Tây mạnh: ưu tiên lam sâu, ban công, cây xanh và lớp bao che chống nóng.');
  if(windScore>=78)notes.push('Hướng mặt tiền khá thuận với một hướng gió chủ đạo; nên tổ chức cửa đối lưu để tận dụng thông gió tự nhiên.');
  else notes.push('Hướng mặt tiền chưa trùng gió chủ đạo; tăng ô mở hai mặt hoặc dùng sân trong/giếng trời để hỗ trợ đối lưu.');
  if(storm>=3)notes.push('Khu vực có rủi ro gió bão cao: cần kiểm tra cửa, mái và liên kết mặt đứng theo hồ sơ kỹ thuật thực tế.');
  return {front,angle:ang,score,windScore,heatLevel,sunPenalty:Math.round(sunPenalty),windAngles:winds,notes};
};

BMH.dataCostBasis = () => {
  const p=BMH.state.project,de=BMH.dataEngineState(),profile=BMH.regionProfile(p.site),cost=de.cost||{},regional=BMH.regionCostFactor(p.site);
  const laborMid=BMH.rangeAverage?.(profile.labor)||500000;
  const laborFactor=BMH.clamp(.92+.08*(laborMid/500000),.94,1.08);
  const market=BMH.clamp(1+(Number(cost.marketAdjustmentPct)||0)/100,.75,1.5);
  const supplier=!!(de.quote?.name&&de.quote?.date);
  const mode=de.pricingMode||'regional';
  const locationFactor=mode==='baseline'?1:regional*laborFactor;
  const shellPerM2=Math.round((Number(cost.shellPerM2)||3600000)*locationFactor*market);
  const finishPerM2=Math.round((Number(cost.finishPerM2)||2350000)*locationFactor*market);
  const prepPerM2=Math.round((Number(cost.prepPerM2)||280000)*locationFactor*market);
  return {
    shellPerM2,finishPerM2,prepPerM2,regionalFactor:regional,laborFactor,marketFactor:market,laborMid,mode,supplier,
    sourceLabel:supplier?`Báo giá nhập: ${de.quote.name}`:'Baseline BMH + hệ số vùng/nhân công',

};

BMH.parseCsvLine = line => {
  const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){out.push(cur.trim());cur='';}else cur+=c;}out.push(cur.trim());return out;
};
BMH.importPriceQuote = async file => {
  if(!file)return;const text=await file.text();let payload=null;
  try{if(file.name.toLowerCase().endsWith('.json'))payload=JSON.parse(text);}catch(_){payload=null;}
  if(!payload){
    const lines=text.split(/\r?\n/).filter(x=>x.trim());const rows=lines.map(BMH.parseCsvLine);const head=(rows.shift()||[]).map(x=>x.toLowerCase());payload={materials:{}};
    for(const r of rows){const obj=Object.fromEntries(head.map((h,i)=>[h,r[i]??''])),key=obj.key||obj.id||obj.item,value=Number(String(obj.value||obj.price||'').replace(/[^0-9.-]/g,''));if(!key||!Number.isFinite(value))continue;
      if(['shellperm2','shell_per_m2'].includes(key.toLowerCase()))payload.shellPerM2=value;
      else if(['finishperm2','finish_per_m2'].includes(key.toLowerCase()))payload.finishPerM2=value;
      else if(['prepperm2','prep_per_m2'].includes(key.toLowerCase()))payload.prepPerM2=value;
      else payload.materials[key]={value,unit:obj.unit||'đv',source:obj.source||'',date:obj.date||''};
      payload.source=payload.source||obj.source;payload.date=payload.date||obj.date;payload.reference=payload.reference||obj.reference;
    }
  }
  const de=BMH.dataEngineState(),cost=de.cost||{};
  const shell=Number(payload.shellPerM2??payload.cost?.shellPerM2),finish=Number(payload.finishPerM2??payload.cost?.finishPerM2),prep=Number(payload.prepPerM2??payload.cost?.prepPerM2);
  if(Number.isFinite(shell)&&shell>0)cost.shellPerM2=shell;if(Number.isFinite(finish)&&finish>0)cost.finishPerM2=finish;if(Number.isFinite(prep)&&prep>0)cost.prepPerM2=prep;
  if(Number.isFinite(Number(payload.marketAdjustmentPct)))cost.marketAdjustmentPct=Number(payload.marketAdjustmentPct);
  de.cost=cost;de.quote={name:String(payload.source||payload.supplier||file.name),date:String(payload.date||new Date().toISOString().slice(0,10)),reference:String(payload.reference||''),importedAt:new Date().toISOString()};
  const mats=payload.materials||{};de.materialOverrides={...(de.materialOverrides||{})};for(const [id,v] of Object.entries(mats)){if(v&&Number(v.value)>0)de.materialOverrides[id]={value:Number(v.value),unit:String(v.unit||'đv'),source:String(v.source||de.quote.name),date:String(v.date||de.quote.date)};}
  de.lastImportAt=new Date().toISOString();de.lastImportName=file.name;de.status.pricing='quote';BMH.save();BMH.render();BMH.toast(`Đã nhập báo giá ${file.name}. Dự toán đã gắn nguồn và ngày báo giá.`);
};

BMH.loadClimateHistory = async (force=false) => {
  const s=BMH.state.project.site,key=`${s.lat.toFixed(3)},${s.lng.toFixed(3)}`;
  if(!force&&BMH.climateHistory?.key===key&&Date.now()-(BMH.climateHistory.ts||0)<6*60*60*1000)return BMH.climateHistory;
  BMH.climateHistoryKey=key;const de=BMH.dataEngineState();de.status.climate='syncing';
  const end=new Date();end.setUTCDate(end.getUTCDate()-7);const start=new Date(end);start.setUTCFullYear(start.getUTCFullYear()-1);start.setUTCDate(start.getUTCDate()+1);
  const iso=d=>d.toISOString().slice(0,10),ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),8500);
  try{
    const url=`https://archive-api.open-meteo.com/v1/archive?latitude=${encodeURIComponent(s.lat)}&longitude=${encodeURIComponent(s.lng)}&start_date=${iso(start)}&end_date=${iso(end)}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=auto`;
    const res=await fetch(url,{signal:ctl.signal});if(!res.ok)throw new Error('history');const data=await res.json();if(BMH.climateHistoryKey!==key)return null;const d=data.daily||{},max=d.temperature_2m_max||[],min=d.temperature_2m_min||[],rain=d.precipitation_sum||[],wind=d.wind_speed_10m_max||[];
    const nums=a=>a.map(Number).filter(Number.isFinite),mean=a=>{a=nums(a);return a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;},sum=a=>nums(a).reduce((x,y)=>x+y,0);
    const temps=max.map((v,i)=>(Number(v)+Number(min[i]))/2).filter(Number.isFinite),winds=nums(wind);
    const summary={key,ts:Date.now(),start:iso(start),end:iso(end),days:d.time?.length||0,avgTemp:mean(temps),rainfall:sum(rain),maxWind:winds.length?Math.max(...winds):NaN,source:'Open-Meteo Historical Weather API'};
    BMH.climateHistory=summary;de.climateSummary={...summary};de.status.climate='live';BMH.save();return summary;
  }catch(_){if(BMH.climateHistoryKey!==key)return null;BMH.climateHistory={key,ts:Date.now(),error:true};de.status.climate='fallback';BMH.save();return BMH.climateHistory;}
  finally{clearTimeout(timer);}
};

BMH.mergeState = (base, incoming) => {
  const isPlain=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  if(!isPlain(incoming)) return structuredClone(base);
  const out=structuredClone(base);
  const merge=(a,b)=>{
    if(!isPlain(a)||!isPlain(b))return a;
    for(const [k,v] of Object.entries(b)){
      if(!(k in a))continue;
      const current=a[k];
      if(Array.isArray(current)){if(Array.isArray(v))a[k]=v;continue;}
      if(isPlain(current)){if(isPlain(v))merge(current,v);continue;}
      if(v===null||typeof v==='object'||typeof v==='undefined')continue;
      a[k]=v;
    }
    return a;
  };
  return merge(out,incoming);
};
BMH.loadState = () => {
  const base=BMH.defaultState(), keys=[BMH.STORAGE_KEY,...(BMH.LEGACY_STORAGE_KEYS||[])];
  for(const key of keys){
    try{
      const raw=localStorage.getItem(key);if(!raw)continue;
      const parsed=JSON.parse(raw);const merged=BMH.mergeState(base,parsed);
      if(key!==BMH.STORAGE_KEY){try{localStorage.setItem(BMH.STORAGE_KEY,JSON.stringify(merged));}catch(_){}}
      return merged;
    }catch(e){try{localStorage.removeItem(key);}catch(_){}}
  }
  return base;
};

BMH.monthlyPayment = (principal, annualRatePct, months) => {
  principal=Number(principal)||0; months=Math.max(1,Number(months)||1); const r=(Number(annualRatePct)||0)/100/12;
  return r===0?principal/months:principal*r/(1-Math.pow(1+r,-months));
};
BMH.loanSchedule = (finance=BMH.state.project.finance) => {
  const months=finance.years*12, rows=[]; let balance=finance.loan;
  for(let m=1;m<=months;m++){
    const annual=m<=finance.promoMonths?finance.introRate:finance.postRate;
    const remain=months-m+1; const payment=BMH.monthlyPayment(balance,annual,remain); const interest=balance*(annual/100/12); const principal=Math.min(balance,Math.max(0,payment-interest));
    rows.push({month:m,annual,payment,principal,interest,balance:Math.max(0,balance-principal)}); balance=Math.max(0,balance-principal);
  }
  return rows;
};
BMH.financeSummary = (finance=BMH.state.project.finance) => {
  const schedule=BMH.loanSchedule(finance); const first=schedule[0]?.payment||0; const post=schedule[Math.min(finance.promoMonths,schedule.length-1)]?.payment||first; const peak=Math.max(...schedule.map(r=>r.payment),0)+finance.existingDebt;
  const dti=finance.income?peak/finance.income:0; const remainder=finance.income-finance.living-peak; const available=finance.cash-finance.reserve+finance.loan;
  return {first,post,peak,dti,remainder,available,schedule};
};
BMH.planArea = () => BMH.state.project.plan.rooms.reduce((s,r)=>s+r.w*r.h,0);

BMH.rangeAverage = value => {
  const nums=String(value||'').replaceAll('.','').match(/\d+(?:,\d+)?/g)?.map(x=>Number(x.replace(',','.'))).filter(Number.isFinite)||[];
  if(!nums.length)return 0;
  return nums.length>1?(nums[0]+nums[1])/2:nums[0];
};
BMH.performancePlan = () => {
  const p=BMH.state.project, perf=p.performance||{}, site=p.site, profile=BMH.regionProfile(site), build=BMH.buildableEnvelope(site), household=BMH.householdNeeds();
  const roofArea=Math.max(18,build.targetPlate*.88), usableSolarArea=roofArea*.56;
  const solarFactors={'TP. Hồ Chí Minh':1450,'Đà Nẵng':1500,'Hà Nội':1250,'Đồng Nai':1500,'Tây Ninh':1550,'Cần Thơ':1480};
  const solarFactor=solarFactors[site.province]||1420, orient=BMH.orientationAnalysis(site), orientMul=.84+(orient.score/100)*.16;
  const solarCapacity=Math.max(0,Math.round((usableSolarArea/5.5)*10)/10), solarYield=Math.round(solarCapacity*solarFactor*orientMul);
  const floorArea=Math.max(BMH.planArea(),build.gfa*.88), heatRisk=BMH.riskValue(profile.heat), rooms=p.plan.rooms.filter(r=>['living','bed','kitchen'].includes(r.type));
  const env=rooms.map(r=>BMH.roomEnvironment?BMH.roomEnvironment(r):null).filter(Boolean), avgHeat=env.length?env.reduce((a,x)=>a+x.heatExposure,0)/env.length:55, avgVent=env.length?env.reduce((a,x)=>a+x.ventilation,0)/env.length:70;
  const modeMul={economy:.94,balanced:1,comfort:1.10}[perf.mode]||1;
  const baseDemand=Math.round((floorArea*(42+heatRisk*9)+household.people*360)*modeMul);
  const passiveReduction=BMH.clamp((perf.coolRoof?.07:0)+(perf.smartShading?.045:0)+(avgVent>=75?.035:avgVent>=60?.018:0)+(orient.score>=80?.025:0),0,.18);
  const demandAfterPassive=Math.round(baseDemand*(1-passiveReduction));
  const selfUse=perf.solarEnabled?Math.min(demandAfterPassive,Math.round(solarYield*.76)):0, gridDemand=Math.max(0,demandAfterPassive-selfUse);
  const electricityRate=3200, baselineElectricCost=baseDemand*electricityRate, annualElectricCost=gridDemand*electricityRate;
  const rainfall=BMH.rangeAverage(profile.rainfall), rainCollected=Math.round((rainfall/1000)*roofArea*.80*10)/10, rainDemand=Math.round(household.people*.045*365*10)/10;
  const rainReuse=perf.rainwaterEnabled?Math.min(rainCollected,rainDemand):0, waterRate=12000, annualWaterSavings=Math.round(rainReuse*waterRate);
  const tankSize=Math.max(2,Math.min(8,Math.round((roofArea*.045)*2)/2));
  const solarCapex=perf.solarEnabled?Math.round(solarCapacity*13500000):0, rainCapex=perf.rainwaterEnabled?Math.round(tankSize*5200000):0, coolRoofCapex=perf.coolRoof?Math.round(roofArea*185000):0, shadingCapex=perf.smartShading?Math.round(Math.max(10,site.width*site.floors*1.6)*620000):0;
  const upgradeCost=solarCapex+rainCapex+coolRoofCapex+shadingCapex, annualEnergySavings=Math.max(0,baselineElectricCost-annualElectricCost), annualSavings=annualEnergySavings+annualWaterSavings;
  const payback=annualSavings>0?upgradeCost/annualSavings:null;
  const comfortScore=BMH.clamp(Math.round(58+orient.score*.16+avgVent*.13+(perf.coolRoof?6:0)+(perf.smartShading?5:0)-Math.max(0,avgHeat-65)*.10),50,97);
  const waterScore=BMH.clamp(Math.round(58+(perf.rainwaterEnabled?18:0)+(BMH.riskValue(profile.flood)>=2?8:4)+(rainReuse>rainDemand*.55?10:4)),50,96);
  const energyScore=BMH.clamp(Math.round(54+passiveReduction*120+(perf.solarEnabled?18:0)+(selfUse/Math.max(1,demandAfterPassive))*20),50,98);
  const tenYearOps=Math.round(annualElectricCost*10), tenYearSavings=Math.round(annualSavings*10), solarCoverage=Math.round(selfUse/Math.max(1,demandAfterPassive)*100);
  return {roofArea,usableSolarArea,solarFactor,solarCapacity,solarYield,floorArea,baseDemand,passiveReduction,demandAfterPassive,selfUse,gridDemand,electricityRate,baselineElectricCost,annualElectricCost,rainfall,rainCollected,rainDemand,rainReuse,waterRate,annualWaterSavings,tankSize,solarCapex,rainCapex,coolRoofCapex,shadingCapex,upgradeCost,annualEnergySavings,annualSavings,payback,comfortScore,waterScore,energyScore,tenYearOps,tenYearSavings,solarCoverage,avgHeat:Math.round(avgHeat),avgVent:Math.round(avgVent),mode:perf.mode||'balanced'};
};
BMH.materialPremium = (choices=BMH.state.project.materials.choices) => Object.entries(choices).reduce((s,[cat,id])=>s+(BMH.MATERIALS[cat]?.find(x=>x.id===id)?.premium||0),0);
BMH.estimate = () => {
  const p=BMH.state.project, area=Math.max(BMH.planArea(),p.site.width*p.site.depth*Math.min(1,p.site.floors*.72));
  const tierMul={economy:.9,standard:1,premium:1.22}[p.materials.tier]||1;
  const basis=BMH.dataCostBasis?BMH.dataCostBasis():{shellPerM2:3600000,finishPerM2:2350000,prepPerM2:280000};
  const shell=Math.round(area*basis.shellPerM2); const finish=Math.round(area*basis.finishPerM2*tierMul)+BMH.materialPremium();
  const adapt=BMH.siteAdaptation?BMH.siteAdaptation(p.site):{roadPct:(p.site.road<3 ? .12 : p.site.road<5 ? .05 : .02),climatePct:0};
  const transport=Math.round((shell+finish)*adapt.roadPct);
  const climatePackage=BMH.climatePackageMultiplier?BMH.climatePackageMultiplier(p.materials.climatePackage):1;
  const climatePrep=Math.round((shell+finish)*adapt.climatePct*climatePackage);
  const performance=BMH.performancePlan?BMH.performancePlan():{upgradeCost:0};
  const performanceUpgrade=Math.round(performance.upgradeCost||0);
  const prep=Math.round(area*(basis.prepPerM2||280000)); const subtotal=shell+finish+transport+climatePrep+performanceUpgrade+prep; const contingency=Math.round(subtotal*.10); const total=subtotal+contingency;
  return {area,shell,finish,transport,climatePrep,climatePackage,performanceUpgrade,performance,adaptation:adapt,basis,prep,contingency,total,budget:BMH.financeSummary().available,gap:BMH.financeSummary().available-total};
};
BMH.kua = (birth,gender='Nam') => {
  let y=String(Math.round(Number(birth)||0)); if(y.length!==4) return null; let sum=[...y].reduce((s,d)=>s+Number(d),0); while(sum>9)sum=[...String(sum)].reduce((s,d)=>s+Number(d),0);
  let k=gender==='Nữ'?(Number(birth)>=2000?6:5)+sum:(Number(birth)>=2000?9:10)-sum; while(k>9)k-=9; while(k<=0)k+=9; if(k===5)k=gender==='Nữ'?8:2;
  const east=[1,3,4,9], dirs=east.includes(k)?['Đông Nam','Đông','Nam','Bắc']:['Tây Nam','Tây','Tây Bắc','Đông Bắc'];
  return {number:k,group:east.includes(k)?'Đông tứ mệnh':'Tây tứ mệnh',dirs};
};
BMH.fengProfile = () => {
  const h=BMH.state.project.household||{}, labels=['Sinh Khí','Thiên Y','Diên Niên','Phục Vị'];
  const owner=BMH.kua(h.ownerBirth,h.ownerGender);
  const partner=(h.partnerEnabled===false||!Number(h.partnerBirth))?null:BMH.kua(h.partnerBirth,h.partnerGender||'Nữ');
  const directions=['Bắc','Đông Bắc','Đông','Đông Nam','Nam','Tây Nam','Tây','Tây Bắc'];
  const ownerWeight=new Map((owner?.dirs||[]).map((d,i)=>[d,4-i]));
  const partnerWeight=new Map((partner?.dirs||[]).map((d,i)=>[d,4-i]));
  const rows=directions.map(dir=>({dir,owner:ownerWeight.get(dir)||0,partner:partnerWeight.get(dir)||0})).map(r=>({...r,score:r.owner+r.partner}));
  const overlap=rows.filter(r=>r.owner&&r.partner).sort((a,b)=>b.score-a.score||b.owner-a.owner||b.partner-a.partner);
  const blended=rows.filter(r=>r.score>0).sort((a,b)=>b.score-a.score||b.owner-a.owner||b.partner-a.partner);
  const ranked=(partner?(overlap.length?overlap:blended):blended).slice(0,4);
  const mode=!partner?'owner-only':overlap.length?'consensus':'balanced';
  const title=mode==='owner-only'?'Theo gia chủ':mode==='consensus'?'Điểm giao nhau của gia chủ + người đồng hành':'Kết hợp gia chủ + người đồng hành';
  const note=mode==='owner-only'?'Đang dùng cung mệnh của gia chủ vì chưa có người đồng hành hợp lệ.'
    :mode==='consensus'?'Các hướng dưới đây cùng thuận cho cả gia chủ và người đồng hành.'
    :'Hai người không trùng toàn bộ hướng tốt, nên hệ thống xếp hạng cân bằng để tham khảo.';
  return {owner,partner,dirs:ranked.map(r=>r.dir),rows:ranked,labels,title,note,mode};
};

BMH.fengDirectionScore = (dir, feng=BMH.fengProfile()) => {
  if(!feng?.owner)return 50;
  const ownerGood=!!feng.owner?.dirs?.includes(dir), partnerGood=!!feng.partner?.dirs?.includes(dir);
  if(!feng.partner)return ownerGood?100:35;
  if(ownerGood&&partnerGood)return 100;
  if(ownerGood||partnerGood)return 62;
  return 28;
};
BMH.directionDecisionMatrix = () => {
  const site=BMH.state.project.site, feng=BMH.fengProfile();
  return BMH.DIRECTIONS.map(([dir,angle])=>{
    const climate=BMH.orientationAnalysis({...site,frontDirection:dir}).score;
    const fengScore=BMH.fengDirectionScore(dir,feng);
    const total=BMH.clamp(Math.round(climate*.72+fengScore*.28),35,98);
    const tag=fengScore>=95?'Hợp cả hai':fengScore>=60?'Hợp một người':fengScore<=30?'Không phải hướng tốt chung':'Tham khảo';
    return {dir,angle,climate,feng:fengScore,total,tag};
  }).sort((a,b)=>b.total-a.total);
};
BMH.householdAdvice = () => {
  const h=BMH.state.project.household, out=[];
  if(h.relatives.some(r=>r.mobility!=='Bình thường')) out.push('Ưu tiên phòng ngủ người lớn tuổi ở tầng trệt, gần WC và lối ra vào, hạn chế bậc cấp.');
  else if(h.relatives.length) out.push('Nên dành lối đi ngắn, chống trượt và WC thuận tiện cho ba mẹ/người thân.');
const feng=BMH.fengProfile(), own=feng?.owner; const childCount=h.children.length;
  if(childCount) out.push(`${childCount} con: bố trí khu học tập có ánh sáng tự nhiên; hướng bàn/giường phong thủy chỉ dùng như tham khảo sau công năng.`);
  if(own) out.push(`Gia chủ thuộc ${own.group}; các hướng tham khảo: ${own.dirs.join(', ')}.`);
  if(feng?.partner) out.push(`${feng.title}: ${feng.dirs.join(', ')}.`);
  return out;
};

BMH.householdNeeds = () => {
  const h=BMH.state.project.household;
  const separateChildren=h.children.filter(c=>c.room!=='Ngủ chung').length;
  const sharedChildren=h.children.length-separateChildren;
  const relativeBedrooms=h.relatives.length?1:0;
  const bedrooms=1+separateChildren+(sharedChildren?1:0)+relativeBedrooms;
  const limited=h.relatives.some(r=>r.mobility&&r.mobility!=='Bình thường');
  const bathrooms=Math.max(1,Math.ceil((2+h.children.length+h.relatives.length)/4));
  return {
    bedrooms,
    bathrooms,
    groundFloorBedroom: h.relatives.length>0,
    accessibleWC: limited||h.relatives.length>0,
    studyZones: h.children.length?Math.max(1,Math.ceil(h.children.length/2)):0,
    people:2+h.children.length+h.relatives.length
  };
};

BMH.designReview = () => {
  const e=BMH.estimate(), issues=BMH.plannerIssues?BMH.plannerIssues():[], p=BMH.state.project;
  const penalty=issues.reduce((s,i)=>s+(i.sev==='error'?10:i.sev==='warn'?5:2),0);
  const circulationScores=Array.from({length:p.site.floors},(_,f)=>BMH.circulationAnalysis?BMH.circulationAnalysis(f).score:80);
  const circulation=circulationScores.length?Math.round(circulationScores.reduce((a,b)=>a+b,0)/circulationScores.length):80;
  const feasibility=BMH.siteFeasibility?BMH.siteFeasibility(p.site):{score:80};
  const functionScore=BMH.clamp(Math.round((96-penalty)*.60+circulation*.24+feasibility.score*.16),45,98);
  const budgetRatio=e.budget>0?e.total/e.budget:1.4;
  const budgetScore=BMH.clamp(Math.round(94-Math.max(0,budgetRatio-.82)*85),42,96);
  const reg=BMH.regionProfile?BMH.regionProfile(p.site):(BMH.REGIONS[p.site.province]||{});
  const climatePenalty=(BMH.riskValue?.(reg.flood)||0)*3+(BMH.riskValue?.(reg.storm)||0)*3+(BMH.riskValue?.(reg.heat)||0)*2+(BMH.riskValue?.(reg.corrosion)||0);
  const envRooms=p.plan.rooms.filter(r=>['living','bed','kitchen'].includes(r.type)), envScores=envRooms.map(r=>BMH.roomEnvironment?BMH.roomEnvironment(r):null).filter(Boolean);
  const daylight=envScores.length?Math.round(envScores.reduce((s,x)=>s+x.daylight,0)/envScores.length):70, ventilation=envScores.length?Math.round(envScores.reduce((s,x)=>s+x.ventilation,0)/envScores.length):70;
  const orientation=BMH.orientationAnalysis?BMH.orientationAnalysis(p.site):{score:75};
  const climateScore=BMH.clamp(Math.round((92-climatePenalty)*.44+daylight*.18+ventilation*.20+orientation.score*.18),52,96);

  const fengProfile=BMH.fengProfile?BMH.fengProfile():null, front=p.site.frontDirection; const fengScore=fengProfile?BMH.clamp(Math.round(BMH.fengDirectionScore(front,fengProfile)*.75+75*.25),45,96):70;

BMH.plannerIssues = () => {
  const p=BMH.state.project, issues=[];
  for(const r of p.plan.rooms){
    if(r.x<0||r.y<0||r.x+r.w>p.site.width+.001||r.y+r.h>p.site.depth+.001)issues.push({sev:'error',text:`${r.name} vượt ranh khu đất.`});
    if(p.plan.rooms.some(o=>BMH.roomsOverlap(r,o)))issues.push({sev:'error',text:`${r.name} đang chồng lên không gian khác.`});
    const ro=p.plan.openings.filter(o=>o.roomId===r.id);
    if(!['corridor','balcony'].includes(r.type) && !ro.some(o=>o.kind==='door'))issues.push({sev:'warn',text:`${r.name} chưa có cửa đi trên mặt bằng.`});
    if(r.type==='bed' && !ro.some(o=>o.kind==='window'))issues.push({sev:'info',text:`${r.name} chưa có cửa sổ/ô thoáng trên mặt bằng.`});
    if(r.type==='bath' && !ro.some(o=>o.kind==='window'))issues.push({sev:'info',text:`${r.name} nên có ô thoáng hoặc giải pháp hút mùi cưỡng bức.`});
    if(r.type==='bed' && Math.min(r.w,r.h)<2.7)issues.push({sev:'warn',text:`${r.name} có cạnh nhỏ hơn 2,7m; nên kiểm tra lại khả năng bố trí giường và lối đi.`});
    if(r.type==='bath' && Math.min(r.w,r.h)<1.2)issues.push({sev:'warn',text:`${r.name} khá hẹp; cần kiểm tra khoảng thao tác thiết bị vệ sinh.`});
  }
  const env=BMH.buildableEnvelope?BMH.buildableEnvelope(p.site):null;
  if(env){for(const r of p.plan.rooms){if(r.x<env.side-.01||r.x+r.w>p.site.width-env.side+.01||r.y<env.front-.01||r.y+r.h>p.site.depth-env.rear+.01)issues.push({sev:'info',text:`${r.name}: đang nằm ngoài khung xây dựng mục tiêu theo khoảng lùi sơ bộ ở Bước 3.`});}}
  for(let f=1;f<p.site.floors;f++){
    const prev=p.plan.rooms.find(r=>r.floor===f-1&&r.type==='stairs'), cur=p.plan.rooms.find(r=>r.floor===f&&r.type==='stairs');
    if(prev&&cur && (Math.abs(prev.x-cur.x)>.5||Math.abs(prev.y-cur.y)>.5)) issues.push({sev:'warn',text:`Cầu thang tầng ${f} và tầng ${f+1} lệch nhau quá 0,5m.`});
  }
  const h=p.household;
  if(h.relatives.length && !p.plan.rooms.some(r=>r.floor===0&&r.type==='bed'))issues.push({sev:'warn',text:'Có ba/mẹ/người thân ở cùng nhưng tầng trệt chưa có phòng ngủ.'});
  const requested=h.children.filter(c=>c.room==='Riêng').length;
  const childBeds=p.plan.rooms.filter(r=>r.type==='bed'&&!/chính|ông bà/i.test(r.name)).length;
  if(childBeds<requested)issues.push({sev:'info',text:`Gia đình yêu cầu ${requested} phòng riêng cho con; mặt bằng hiện có ${childBeds} phòng phù hợp.`});
  if(!p.plan.rooms.some(r=>r.type==='bath'))issues.push({sev:'warn',text:'Chưa có WC trong mặt bằng.'});
  for(const r of p.plan.rooms){
    if(['living','bed','kitchen'].includes(r.type)){const env=BMH.roomEnvironment?BMH.roomEnvironment(r):null;if(env&&env.daylight<58)issues.push({sev:'info',text:`${r.name}: ánh sáng tự nhiên đang thấp; nên tăng ô mở trên tường ngoài.`});if(env&&env.ventilation<58)issues.push({sev:'info',text:`${r.name}: thông gió tự nhiên còn yếu; cân nhắc thêm cửa sổ hoặc thông gió chéo.`});}
  }
  for(let f=1;f<p.site.floors;f++)issues.push(...(BMH.coordinationIssues?BMH.coordinationIssues(f):[]));
  for(let f=0;f<p.site.floors;f++){const ca=BMH.circulationAnalysis?BMH.circulationAnalysis(f):null;if(ca){if(!ca.entries.length)issues.push({sev:'warn',text:`Tầng ${f+1} chưa có cửa ra/vào ngoài nhà được nhận diện.`});ca.unreachable.forEach(r=>issues.push({sev:'warn',text:`${r.name}: chưa có đường lưu thông liên tục qua cửa đi.`}));ca.narrow.forEach(r=>issues.push({sev:'warn',text:`${r.name}: bề rộng lưu thông nhỏ hơn 0,9m.`}));if(!ca.elderlyReady)issues.push({sev:'info',text:'Lối tiếp cận phòng người lớn tuổi/WC tầng trệt cần được kiểm tra lại.'});}}
  const hot=BMH.riskValue(BMH.regionProfile(p.site).heat)>=2; p.plan.rooms.filter(r=>['bed','living'].includes(r.type)).forEach(r=>{const env=BMH.roomEnvironment(r);if(hot&&env.westWidth>=1.2)issues.push({sev:'info',text:`${r.name}: ô mở hướng Tây khá lớn trong vùng nóng; nên kiểm tra lam che, kính và cây xanh.`});if(env.windCapture<55)issues.push({sev:'info',text:`${r.name}: khả năng đón gió chủ đạo còn thấp; cân nhắc thêm ô mở đối lưu.`});});

BMH.wallSegments = (floor=BMH.state.ui.planner.floor) => {
  const rooms=BMH.floorRooms(floor), edges=[];
  const add=(o,c,a,b)=>{if(b>a+.001)edges.push({o,c:+c.toFixed(4),a:+a.toFixed(4),b:+b.toFixed(4)});};
  rooms.forEach(r=>{add('h',r.y,r.x,r.x+r.w);add('h',r.y+r.h,r.x,r.x+r.w);add('v',r.x,r.y,r.y+r.h);add('v',r.x+r.w,r.y,r.y+r.h);});
  const groups=new Map(); edges.forEach(e=>{const k=`${e.o}:${e.c}`; if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e);});
  const out=[];
  for(const es of groups.values()){
    const cuts=[...new Set(es.flatMap(e=>[e.a,e.b]))].sort((a,b)=>a-b);
    for(let i=0;i<cuts.length-1;i++){
      const a=cuts[i],b=cuts[i+1],mid=(a+b)/2,count=es.filter(e=>e.a<=mid+.0001&&e.b>=mid-.0001).length;

  return out;
};

BMH.externalSides = room => {
  const rooms=BMH.floorRooms(room.floor), eps=.01, overlap=(a1,a2,b1,b2)=>Math.min(a2,b2)-Math.max(a1,b1)>.15;

    (side==='north'&&Math.abs(o.y+o.h-room.y)<eps&&overlap(o.x,o.x+o.w,room.x,room.x+room.w))

BMH.roomEnvironment = room => {
  const ext=BMH.externalSides(room), openings=BMH.state.project.plan.openings.filter(o=>o.roomId===room.id), windows=openings.filter(o=>o.kind==='window'&&ext.includes(o.side));
  const totalWidth=windows.reduce((s,o)=>s+(Number(o.width)||0),0), area=Math.max(.1,room.w*room.h), distinct=[...new Set(windows.map(o=>o.side))];
  const profile=BMH.regionProfile(BMH.state.project.site), heatRisk=BMH.riskValue(profile.heat), windAngles=BMH.windDirectionAngles(profile);
  const sideAngle={north:0,east:90,south:180,west:270};
  const westWidth=windows.filter(o=>o.side==='west').reduce((a,o)=>a+(Number(o.width)||0),0);
  const windAligned=windows.filter(o=>Math.min(...windAngles.map(a=>BMH.angleDiff(sideAngle[o.side]??0,a)))<=55);
  const heatExposure=BMH.clamp(Math.round(22+westWidth*18*heatRisk+((ext.includes('west')&&heatRisk>=2)?12:0)),12,96);
  const windCapture=BMH.clamp(Math.round(35+windAligned.length*24+(distinct.length>=2?12:0)),30,98);
  const daylight=BMH.clamp(Math.round(42+(totalWidth/Math.max(2.4,Math.sqrt(area)*2))*55+ext.length*4-westWidth*heatRisk*1.5),30,98);

BMH.roomSector = room => {

  const ang=(Math.atan2(east,north)*180/Math.PI+360)%360;

};
BMH.roomPlacementReview = room => {

BMH.roomSuggestionSpots = (room,limit=3) => {

  const xs=[],ys=[];for(let x=0;x<=site.width-room.w+.001;x+=step)xs.push(+x.toFixed(2));for(let y=0;y<=site.depth-room.h+.001;y+=step)ys.push(+y.toFixed(2));

    if(!BMH.layoutValid(candidate.rooms))continue;

  const balconyMarkup=rel.filter(r=>r.type==='balcony').map(r=>{const z=r.floor*zStep+1.05,a=P(r.x,r.y+r.h,z),b=P(r.x+r.w,r.y+r.h,z),c=P(r.x,r.y+r.h,z+1.0),d=P(r.x+r.w,r.y+r.h,z+1.0);return `<g class="iso-balcony-rail"><line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}"/><line x1="${b[0]}" y1="${b[1]}" x2="${d[0]}" y2="${d[1]}"/><line x1="${c[0]}" y1="${c[1]}" x2="${d[0]}" y2="${d[1]}"/></g>`}).join('');

BMH.loadExternalScript = (url, timeout=6000) => new Promise((resolve,reject)=>{
  const script=document.createElement('script'); let settled=false;
  const finish=(ok,err)=>{if(settled)return;settled=true;clearTimeout(timer);ok?resolve():reject(err||new Error('Load failed'));};
  script.src=url;script.async=true;script.crossOrigin='anonymous';script.onload=()=>finish(true);script.onerror=()=>finish(false,new Error('Script unavailable'));
  const timer=setTimeout(()=>finish(false,new Error('Script timeout')),timeout);document.head.appendChild(script);
});
BMH.ensureLeaflet = () => {
  if(window.L)return Promise.resolve(window.L);
  if(BMH.leafletPromise)return BMH.leafletPromise;
  const sources=[
    {js:'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',css:'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'},
    {js:'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',css:'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'}
  ];
  BMH.leafletPromise=(async()=>{
    for(const src of sources){
      try{
        if(!document.querySelector(`link[data-leaflet-css="${src.css}"]`)){const link=document.createElement('link');link.rel='stylesheet';link.href=src.css;link.dataset.leafletCss=src.css;document.head.appendChild(link);}
        await BMH.loadExternalScript(src.js);if(window.L)return window.L;
      }catch(e){}
    }
    return null;
  })();
  return BMH.leafletPromise;
};
BMH.ensureGoogleMaps = () => {
  if(window.google?.maps)return Promise.resolve(window.google.maps);
  if(!BMH.GOOGLE_MAPS_KEY)return Promise.resolve(null);
  if(BMH.googleMapsPromise)return BMH.googleMapsPromise;
  const url=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(BMH.GOOGLE_MAPS_KEY)}&loading=async&v=weekly&language=vi&region=VN`;
  BMH.googleMapsPromise=BMH.loadExternalScript(url,8000).then(()=>window.google?.maps||null).catch(()=>null);
  return BMH.googleMapsPromise;
};
BMH.mapEmbedUrl = (site=BMH.state.project.site) => {
  const lat=Number(site.lat)||10.77,lng=Number(site.lng)||106.69,z=BMH.clamp(Number(site.mapZoom)||17,3,20);
  if(['satellite','hybrid'].includes(site.mapStyle)) return `https://maps.google.com/maps?q=${lat},${lng}&t=k&z=${z}&ie=UTF8&iwloc=&output=embed`;
  const span=Math.max(.004,0.04/Math.max(1,z/6));
  const bbox=[lng-span,lat-span,lng+span,lat+span].map(v=>Number(v).toFixed(6)).join(',');
  return `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat.toFixed(6)}%2C${lng.toFixed(6)}`;
};

document.addEventListener('change',e=>{
  const t=e.target;
  if(t?.id==='uploadPhoto'){if(t.files?.[0]){BMH.toast('Đã nhận ảnh tham khảo. Tiếp tục nhập thông tin dự án.');BMH.navigateTo(2);}t.value='';return;}
  if(t?.id==='uploadPlan'){if(t.files?.[0]){BMH.toast('Đã nhận bản vẽ tham chiếu. Bạn có thể đối chiếu ở Bước 5.');BMH.navigateTo(2);}t.value='';return;}
  if(t?.id==='priceQuoteUpload'){if(t.files?.[0])BMH.importPriceQuote(t.files[0]).catch(()=>BMH.toast('Không đọc được file báo giá. Dùng JSON hoặc CSV theo mẫu V4.8.'));t.value='';return;}
  if(!t.closest?.('#app'))return;
  if(t.dataset.path){let v=t.type==='checkbox'?t.checked:(t.type==='number'?Number(t.value)*(Number(t.dataset.scale)||1):t.value);const path=t.dataset.path;if(path==='project.site.province'){const r=BMH.REGIONS[v];BMH.state.project.site.province=v;if(r){const pt=BMH.regionPoint(v,r.defaultDistrict);Object.assign(BMH.state.project.site,{district:pt.district,lat:pt.lat,lng:pt.lng,geoSource:'Dữ liệu vùng'});}BMH.liveWeather=null;BMH.save();BMH.render();return;}if(path==='project.site.district'){BMH.state.project.site.district=v;const pt=BMH.regionPoint(BMH.state.project.site.province,v);BMH.state.project.site.lat=pt.lat;BMH.state.project.site.lng=pt.lng;BMH.state.project.site.geoSource='Dữ liệu vùng';BMH.liveWeather=null;BMH.save();BMH.render();return;}BMH.set(path,v);return;}
  if(t.dataset.person){const h=BMH.state.project.household,list=t.dataset.person==='child'?h.children:h.relatives,p=list.find(x=>x.id===t.dataset.id);if(p){p[t.dataset.key]=t.type==='number'?Number(t.value):t.value;BMH.save();BMH.render();}return;}
  if(t.dataset.planner){const ui=BMH.state.ui.planner;if(t.dataset.planner==='snap')ui.snap=Number(t.value);if(t.dataset.planner==='furniture')ui.showFurniture=t.checked;if(t.dataset.planner==='dimensions')ui.showDimensions=t.checked;if(t.dataset.planner==='feng')ui.showFeng=t.checked;if(t.dataset.planner==='below')ui.showBelow=t.checked;if(t.dataset.planner==='structure')ui.showStructure=t.checked;if(t.dataset.planner==='environment')ui.showEnvironment=t.checked;if(t.dataset.planner==='circulation')ui.showCirculation=t.checked;if(t.dataset.planner==='sectionLine')ui.showSectionLine=t.checked;if(t.dataset.planner==='climate')ui.showClimate=t.checked;if(t.dataset.planner==='envelope')ui.showEnvelope=t.checked;BMH.save();BMH.render();return;}
  if(t.dataset.roomField){const r=BMH.selectedRoom();if(!r)return;BMH.pushPlanHistory();const key=t.dataset.roomField,old={...r};r[key]=['x','y','w','h'].includes(key)?Number(t.value):t.value;if(['x','y','w','h'].includes(key)){r[key]=BMH.roundTo(r[key],BMH.state.ui.planner.snap);if(!BMH.roomValid(r)){Object.assign(r,old);BMH.toast('Giá trị mới gây chồng phòng hoặc vượt ranh.');}}BMH.save();BMH.render();return;}
  if(t.dataset.openingField){const o=BMH.state.project.plan.openings.find(x=>x.id===t.dataset.openingId);if(o){const old={...o};BMH.pushPlanHistory();o[t.dataset.openingField]=['width','offset'].includes(t.dataset.openingField)?Number(t.value):t.value;if(!BMH.openingFits(o,o.id)){Object.assign(o,old);BMH.planHistory.undo.pop();BMH.toast('Kích thước/vị trí ô mở đang trùng hoặc vượt chiều dài tường.');}BMH.save();BMH.render();}return;}
  if(t.matches('[data-scene-focus]')){BMH.state.ui.sceneFocus=t.value;BMH.save();BMH.render();return;}
  if(t.dataset.check){BMH.state.project.checklist[t.dataset.check]=t.checked;BMH.save();return;}
});

BMH.paintPlacementHint = (review,invalidText='') => {
  const box=BMH.$('#placementHint');if(!box)return;
  box.classList.remove('placement-good','placement-mid','placement-bad','invalid');
  if(invalidText){box.classList.add('placement-bad','invalid');box.innerHTML=`<strong>KHÔNG HỢP</strong><b>—</b><span>Vị trí đang bị chặn</span><small>${BMH.esc(invalidText)}</small>`;return;}
  if(!review)return;
  box.classList.add(`placement-${review.code}`);box.innerHTML=`<strong>${review.status}</strong><b>${review.score}/100</b><span>${BMH.esc(review.name)} · vùng ${BMH.esc(review.sector)}</span><small>${BMH.esc(review.notes[0]||'Vị trí đang được đánh giá.')}</small>`;
};
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest?.('#app'))return;
  if(BMH.state.ui.step!==5||BMH.state.ui.planner.tool!=='select')return;
  const edge=e.target.closest('[data-edge-id]'),handle=e.target.closest('[data-resize-id]'),group=e.target.closest('[data-room-id]');
  const id=edge?.dataset.edgeId||handle?.dataset.resizeId||group?.dataset.roomId;if(!id)return;
  const r=BMH.state.project.plan.rooms.find(x=>x.id===id);if(!r)return;if(BMH.isRoomLocked(id)){BMH.state.ui.planner.selected=id;BMH.save();BMH.render({preserveScroll:true});BMH.toast('Phòng này đang khóa. Mở khóa trong bảng thông tin nếu muốn di chuyển.');return;}const svg=BMH.$('#plannerSvg');if(!svg)return;
  const rect=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,selectionChanged=BMH.state.ui.planner.selected!==id;
  BMH.drag={id,mode:edge?'edge':handle?'resize':'move',side:edge?.dataset.edgeSide||null,startX:e.clientX,startY:e.clientY,scaleX:vb.width/rect.width,scaleY:vb.height/rect.height,originalPlan:BMH.planSnapshot(),changed:false,selectionChanged,invalid:false,historyPushed:false,raf:false};
  BMH.state.ui.planner.selected=id;document.documentElement.classList.add('room-dragging');BMH.paintPlacementHint(BMH.roomPlacementReview(r));e.preventDefault();
});
window.addEventListener('pointermove',e=>{
  const d=BMH.drag;if(!d)return;const dx=(e.clientX-d.startX)*d.scaleX,dy=(e.clientY-d.startY)*d.scaleY,s=BMH.state.ui.planner.snap,site=BMH.state.project.site;
  let candidate=structuredClone(d.originalPlan.rooms),r=candidate.find(x=>x.id===d.id);if(!r)return;
  if(d.mode==='move'){r.x=BMH.clamp(BMH.roundTo(r.x+dx,s),0,site.width-r.w);r.y=BMH.clamp(BMH.roundTo(r.y+dy,s),0,site.depth-r.h);d.guides=BMH.smartSnapMove(r,candidate);}
  else if(d.mode==='resize'){d.guides=[];r.w=BMH.clamp(BMH.roundTo(r.w+dx,s),.6,site.width-r.x);r.h=BMH.clamp(BMH.roundTo(r.h+dy,s),.6,site.depth-r.y);}
  else {d.guides=[];const delta=BMH.roundTo((d.side==='east'||d.side==='west')?dx:dy,s);candidate=BMH.edgeMoveCandidate(d.originalPlan.rooms,d.id,d.side,delta);}
  if(!candidate||!BMH.layoutValid(candidate)){d.invalid=true;d.guides=[];BMH.paintPlacementHint(null,'Phòng đang chồng không gian khác hoặc vượt ranh lô đất. Hãy kéo về vùng trống.');return;}
  d.invalid=false;
  if(!d.historyPushed){BMH.planHistory.undo.push(structuredClone(d.originalPlan));if(BMH.planHistory.undo.length>30)BMH.planHistory.undo.shift();BMH.planHistory.redo.length=0;d.historyPushed=true;}
  BMH.state.project.plan.rooms=candidate;d.changed=true;const moved=candidate.find(x=>x.id===d.id);d.review=BMH.roomPlacementReview(moved);BMH.lastPlacementReview=d.review;BMH.paintPlacementHint(d.review);
  if(!d.raf){d.raf=true;requestAnimationFrame(()=>{d.raf=false;BMH.render({preserveScroll:true});});}
});
BMH.finishRoomDrag = () => {const d=BMH.drag;if(!d)return;BMH.drag=null;document.documentElement.classList.remove('room-dragging');if(d.changed){BMH.save();const r=BMH.state.project.plan.rooms.find(x=>x.id===d.id),review=r?BMH.roomPlacementReview(r):d.review;BMH.lastPlacementReview=review;BMH.render({preserveScroll:true});if(review)BMH.toast(`${review.name}: ${review.status} ${review.score}/100 · ${review.notes[0]||'Đã cập nhật vị trí.'}`);}else if(d.selectionChanged){BMH.save();BMH.render({preserveScroll:true});}else if(d.invalid){BMH.toast('Vị trí đó không hợp lệ vì chồng phòng hoặc vượt ranh.');}};
window.addEventListener('pointerup',BMH.finishRoomDrag);
window.addEventListener('pointercancel',BMH.finishRoomDrag);

document.addEventListener('keydown',e=>{
  if(BMH.state.ui.step!==5)return;
  const tag=(e.target?.tagName||'').toLowerCase();if(tag==='input'||tag==='select'||tag==='textarea')return;
  if(e.key==='Escape'&&BMH.state.ui.planner.tool!=='select'){BMH.state.ui.planner.tool='select';BMH.save();BMH.render();BMH.toast('Đã trở về công cụ chọn.');return;}
  if(!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==='d'){BMH.state.ui.planner.tool='door';BMH.save();BMH.render();BMH.toast('Công cụ cửa đi · nhấp lên cạnh tường.');return;}
  if(!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==='w'){BMH.state.ui.planner.tool='window';BMH.save();BMH.render();BMH.toast('Công cụ cửa sổ · nhấp lên cạnh tường.');return;}
  if(!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==='f'){BMH.state.ui.planner.zoom=1;BMH.save();BMH.render();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?BMH.redoPlan():BMH.undoPlan();}
});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')BMH.save();}); window.addEventListener('pagehide',BMH.save);
window.addEventListener('load',()=>{try{if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});if('caches'in window)caches.keys().then(keys=>Promise.all(keys.filter(k=>String(k).startsWith('bmh-')).map(k=>caches.delete(k)))).catch(()=>{});}catch(_){}});
globalThis.BuildMyHome=BMH;
if(BMH.DEV){const q=new URLSearchParams(location.search);const qs=Number(q.get('step'));if(qs>=1&&qs<=10)BMH.state.ui.step=qs;if(q.get('unlock')==='1'){BMH.state.access.paid=true;BMH.state.access.source='dev-query';BMH.state.access.verifiedAt=new Date().toISOString();}}
BMH.render();
BMH.cloudInit?.().catch(()=>{});
globalThis.__BMH_BOOT_OK=true;

}catch(err){
  try{globalThis.__BMH_BOOT_FAILED=true;globalThis.__BMH_BOOT_ERROR=String(err?.stack||err?.message||err);console.error('Build My Home fatal boot error',err);const a=document.getElementById('app');if(a)a.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#f7f9f6;font-family:Arial,sans-serif;color:#5b4037"><div style="max-width:720px;padding:28px"><h2>Build My Home gặp lỗi khởi động</h2><p>Runtime đã được nạp, nhưng một lỗi JavaScript đã dừng quá trình khởi tạo. Hãy gửi nội dung lỗi dưới đây để xử lý.</p><pre style="white-space:pre-wrap;background:#fff7f3;border:1px solid #efd4c6;border-radius:12px;padding:12px;font-size:12px">'+String(err?.stack||err?.message||err).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></div></div>'; }catch(_){}
}
})();
</script></body></html>
